<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f4f6f9;
            font-family: Arial, Helvetica, sans-serif;
            color: #333333;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 8px;
            overflow: hidden;
        }

        .logo-section {
            background: #ffffff;
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #eeeeee;
        }

        .logo-section img {
            width: 80px;
            max-width: 100%;
            height: auto;
        }

        .alert-header {
            background: #E91E63;
            color: #ffffff;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            padding: 18px;
            letter-spacing: 1px;
        }

        .content {
            padding: 25px;
        }

        .badge {
            display: inline-block;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .badge-black {
            background: #E91E63;
            color: #ffffff;
        }

        .card {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 6px;
            overflow: hidden;
        }

        .row {
            padding: 14px 18px;
            border-bottom: 1px solid #e8e8e8;
        }

        .row:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 13px;
            font-weight: bold;
            color: #666666;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .value {
            font-size: 16px;
            color: #222222;
        }

        .footer {
            padding: 18px 25px;
            background: #fafafa;
            border-top: 1px solid #eeeeee;
            font-size: 12px;
            color: #777777;
        }

        .footer strong {
            color: #444444;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Logo -->

        <div class="logo-section">
            <img src="logo.png" alt="Richard Coglan Ltd">
        </div>

        <!-- Alert Header -->

        <div class="alert-header" style="background:#222222;">
            TONER ALERT
        </div>

        <div class="content">

            <!-- Toner Badge -->



            <div class="badge" style="background:#222222;color:#ffffff;">
                BLACK TONER LOW
            </div>

            <!-- Alert Details -->

            <div class="card">

                <div class="row">
                    <div class="label">Occurred Time</div>
                    <div class="value">09/06/2026 12:02:51</div>
                </div>

                <div class="row">
                    <div class="label">Location</div>
                    <div class="value">RENAULT WORCS STARTIN</div>
                </div>

                <div class="row">
                    <div class="label">Machine Serial</div>
                    <div class="value">A798325100771</div>
                </div>

                <div class="row">
                    <div class="label">IP Address</div>
                    <div class="value">197.0.104.29</div>
                </div>

                <div class="row">
                    <div class="label">Issue</div>
                    <div class="value">Supply Toner. Black</div>
                </div>

            </div>

        </div>

        <!-- Footer -->

        <div class="footer">
            <strong>Richard Coglan Monitoring System</strong><br><br>
            This is an automated notification generated from the printer monitoring platform.
        </div>

    </div>

</body>

</html>
